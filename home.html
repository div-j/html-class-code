<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            font-family: "Plus Jakarta Sans", sans-serif;
            background-color: #f7f9fb;
            color: #191c1e;
            line-height: 1.5;
        }
        *{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        header{
          background-color: white;
          display: flex;
          justify-content: space-between;
          border-bottom: solid 1px #e0e3e5;
          max-width: 1000px;
          margin: auto;
          padding: 16px 24px;
        }
        #left-nav{
          display: flex;
          align-items: center;
          gap: 12px;

          ul{
            display: flex;
            list-style: none;
          
            a{
              text-decoration: none;
              color: #464554;
              font-weight: 600;
              padding: 6px 12px;
              border-radius: 8px;
              transition: all 0.4s ease;
            }
          
            a:hover{
              background-color: #e6e8ea;
              color: #4648d4;
            }

             a.active{
              background-color: #e6e8ea;
              color: #4648d4;
            }

          }

           #logo{
              font-size: 20px;
              font-weight: bold;
              color: #4648d4;
            }
        }

        #right-nav{
          display: flex;
          align-items: center;
          gap: 12px;

          p{
            background-color: #e6e8ea;
            padding: 6px 12px;
            font-weight: 600;
            font-size: 14px;
            border-radius: 20px;

          }
          #avatar{
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: solid 2px #4648d4;
            object-fit: cover;
          }
        }

@media (max-width: 640px) {

  header{
    flex-direction: column;
    gap: 12px;

  }
 
}
        
    
    </style>
  </head>
  <body>
    <header>
      <section id="left-nav">
        <h2 id="logo">QuizMaster</h2>
        <nav id="nav">
          <ul>
            <a class="active" href="#"> <li>Home</li></a>
            <a href="#"> <li>Ranks</li></a>
            <a href="#"> <li>Profile</li></a>
          </ul>
        </nav>
      </section>
      <section id="right-nav" >
        <p>Lvl 12 • 450 Coins</p>
        <img id="avatar" src="https://i.pravatar.cc/100?img=12" alt="user image">
      </section>
    </header>

    <section id="hero" class="text-center p-4 bg-dark text-white">
    <h3 class="">Ready To Play, Samuel? 👍</h3>
    <p>Your brain is warmed up. Lets crush todays challenges!</p>
    <img style="border-radius: 5px;" width="100%" src="./images/hero2.jpg" alt="">

    </section>

    <!-- <section id="hero"></section>
    <section id="about"></section>
    <section id="contact"></section> -->
  </body>
</html>
