
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="container mt-4">
    <h1 class="text-center">Calculator</h1>
    <div>
        <input id="num1" class="form-control" type="text" placeholder="Enter a number"> <br>
        <input id='num2'class="form-control" type="text" placeholder="Enter a second number">
        <br>
         <input id='operand'class="form-control" type="text" placeholder="Enter an operand eg.(=,-,*,/)">

        <button onclick="add()" class="btn mt-3 bg-primary text-white">Result</button>
        <h1 id="result" class="mt-2 bg-dark text-white "></h1>
    </div>


    <script>
        function add(){
            a = document.getElementById('num1').value
            b = document.getElementById('num2').value
            op = document.getElementById("operand").value

           if(op=='+'){
            c = parseInt(a)+ parseInt(b)
           }else if(op=='-'){
            c = parseInt(a)- parseInt(b)
        }
           
           else{
            alert("i dont know what you want to do")
           }
           document.getElementById('result').innerText=c;

        }
    </script>
    
</body>
</html>
