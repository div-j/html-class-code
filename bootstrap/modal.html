<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Active Session - Bootstrap Modal</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Page Content (just a trigger button) -->
  <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center">
    <h1 class="mb-4 fw-bold text-primary">QuizMaster</h1>
    <p class="text-secondary mb-4">Click the button below to start the quiz</p>
    
    <!-- Button that opens the modal -->
    <button type="button" class="btn btn-primary btn-lg px-5 py-3 rounded-3 fw-semibold" 
            data-bs-toggle="modal" data-bs-target="#quizModal">
      <i class="bi bi-play-fill me-2"></i> Start Quiz
    </button>
  </div>

  <!-- ===================== QUIZ MODAL ===================== -->
  <div class="modal fade" id="quizModal" tabindex="-1" aria-labelledby="quizModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow">
        
        <!-- Modal Header -->
        <div class="modal-header border-0 pb-0">
          <button type="button" class="btn btn-light rounded-circle" data-bs-dismiss="modal" aria-label="Close">
            <i class="bi bi-x-lg"></i>
          </button>
          
          <h5 class="modal-title fw-bold text-primary mx-auto" id="quizModalLabel">
            QuizMaster
          </h5>
          
          <span class="badge bg-light text-secondary rounded-pill px-3 py-2">
            <i class="bi bi-star-fill text-warning me-1"></i>
            Lvl 12 • 450 Coins
          </span>
        </div>

        <!-- Modal Body -->
        <div class="modal-body px-4 pb-4">

          <!-- Question Counter + Timer -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="badge bg-secondary-subtle text-secondary-emphasis rounded-pill px-3 py-2">
              Question 4 of 10
            </span>
            <span class="badge bg-danger-subtle text-danger-emphasis rounded-pill px-3 py-2">
              <i class="bi bi-clock me-1"></i> 00:12
            </span>
          </div>

          <!-- Question Card -->
          <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            
            <!-- Progress Bar -->
            <div class="progress rounded-0" style="height: 6px;">
              <div class="progress-bar bg-primary" role="progressbar" style="width: 40%;" 
                   aria-valuenow="40" aria-valuemin="0" aria-valuemax="100"></div>
            </div>

            <div class="card-body p-4 text-center">
              
              <!-- Category -->
              <span class="badge bg-primary-subtle text-primary-emphasis rounded-pill px-3 py-1 mb-3 text-uppercase">
                Astronomy
              </span>

              <!-- Question -->
              <h2 class="h4 fw-bold mb-4">
                What is the largest planet in our solar system?
              </h2>

              <!-- Options -->
              <div class="row g-3">
                
                <!-- Option A -->
                <div class="col-12 col-md-6">
                  <button class="btn btn-outline-secondary w-100 text-start d-flex justify-content-between align-items-center py-3 px-3 rounded-3">
                    <span class="fw-semibold text-primary">A. Mars</span>
                    <span class="border border-2 rounded-circle d-inline-block" style="width: 20px; height: 20px;"></span>
                  </button>
                </div>

                <!-- Option B -->
                <div class="col-12 col-md-6">
                  <button class="btn btn-outline-secondary w-100 text-start d-flex justify-content-between align-items-center py-3 px-3 rounded-3">
                    <span class="fw-semibold text-primary">B. Venus</span>
                    <span class="border border-2 rounded-circle d-inline-block" style="width: 20px; height: 20px;"></span>
                  </button>
                </div>

                <!-- Option C (Selected) -->
                <div class="col-12 col-md-6">
                  <button class="btn btn-primary w-100 text-start d-flex justify-content-between align-items-center py-3 px-3 rounded-3">
                    <span class="fw-semibold">C. Jupiter</span>
                    <span class="bg-white rounded-circle d-flex align-items-center justify-content-center" 
                          style="width: 20px; height: 20px;">
                      <span class="bg-primary rounded-circle" style="width: 10px; height: 10px;"></span>
                    </span>
                  </button>
                </div>

                <!-- Option D -->
                <div class="col-12 col-md-6">
                  <button class="btn btn-outline-secondary w-100 text-start d-flex justify-content-between align-items-center py-3 px-3 rounded-3">
                    <span class="fw-semibold text-primary">D. Saturn</span>
                    <span class="border border-2 rounded-circle d-inline-block" style="width: 20px; height: 20px;"></span>
                  </button>
                </div>

              </div>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="d-grid d-md-flex justify-content-md-end mt-4">
            <button class="btn btn-primary btn-lg px-5 py-3 rounded-3 fw-semibold">
              Submit Answer
              <i class="bi bi-arrow-right ms-2"></i>
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
